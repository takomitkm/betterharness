[package]
name = "app-web"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# 独立 workspace：Dioxus 的依赖树不进主 workspace 的门禁（主门禁 = cargo test --workspace）。
# web 构建：cargo build --release --target wasm32-unknown-unknown（default features）。
# desktop 构建（Phase 6）：cargo build --release --no-default-features --features desktop
#   （dx 约定；Native Core + 系统 WebView2）。
[workspace]

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[dependencies]
dioxus = { version = "0.7" }
composer-core = { path = "../crates/composer-core" }
composer-keynav = { path = "../crates/composer-keynav" }
composer-completion = { path = "../crates/composer-completion" }
composer-host = { path = "../crates/composer-host" }
composer-runtime = { path = "../crates/composer-runtime" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"
taino-edit-core = "0.7"
taino-edit-dioxus = "0.7"
taino-edit-extensions = "0.7"

# web 专有 interop（desktop 原生构建不拉 wasm-bindgen 栈）。
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["CustomEvent", "CustomEventInit", "Window", "Document", "EventTarget"] }
js-sys = "0.3"
