<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Betterharness · Reliable Chat Composer</title>
  <style>
    :root{color-scheme:light;--ink:#172b2a;--muted:#596d69;--line:#d9e4df;--accent:#176a54;--paper:#fffefb}
    *{box-sizing:border-box}body{margin:0;background:#f3f6f1;color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}
    main{max-width:900px;margin:0 auto;padding:48px 22px}h1{margin:8px 0;font-size:clamp(25px,4vw,36px);line-height:1.3}
    header>p:last-child,footer{color:var(--muted)}.eyebrow{font:12px/1.5 ui-monospace,monospace;letter-spacing:.1em;color:var(--accent)}
    .demo-settings,.host-controls,.composer-actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.demo-settings{margin:24px 0}
    label{display:flex;gap:8px;align-items:center;font-size:13px}select,button,input{font:inherit}select,button{border:1px solid var(--line);border-radius:7px;padding:7px 11px;background:var(--paper);color:var(--ink)}
    button{cursor:pointer}button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    [data-testid=send]{background:var(--accent);color:white;border-color:var(--accent)}.chat-composer{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px}
    textarea,[contenteditable]{font:16px/1.7 inherit;min-height:120px;width:100%;border:0;resize:vertical;outline:none;background:transparent;color:inherit;padding:8px}
    .rich-editor{position:relative;border-bottom:1px solid var(--line);margin-bottom:10px}.placeholder{position:absolute;top:8px;left:8px;color:var(--muted);pointer-events:none}.composer-paragraph{margin:0}.mention{background:#dceee5;color:#155941;border-radius:4px;padding:1px 4px}
    .attachments{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.attachments>span{background:#edf3ec;padding:4px 8px;border-radius:6px}.attachments button{padding:0 6px;margin-left:6px}.composer-actions input[type=file]{max-width:190px;font-size:12px}
    [role=status]{font-size:13px;color:var(--muted)}[role=alert]{background:#fff1da;border-radius:6px;padding:10px}
    ol{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}li{border-top:1px solid var(--line);padding:14px 0 4px}li strong{font-size:12px;color:var(--muted)}li[data-status=unknown] strong{color:#945e04}li[data-status=rejected] strong{color:#a93b35}li[data-status=accepted] strong{color:var(--accent)}
    .message-text{white-space:pre-wrap;overflow-wrap:anywhere;margin:5px 0}li small{display:block;color:var(--muted)}li button{font-size:12px;margin:8px 8px 0 0}.host-controls{margin:18px 0;font-size:13px}footer{border-top:1px solid var(--line);padding-top:16px;font-size:12px}
    @media(max-width:540px){main{padding:24px 14px}.chat-composer{padding:14px}.demo-settings{align-items:stretch;flex-direction:column}.demo-settings label{justify-content:space-between}}
  </style>
</head>
<body><div id="root"></div><script type="module" src="./demo.js"></script></body>
</html>
